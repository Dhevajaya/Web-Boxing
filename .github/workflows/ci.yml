name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Kesetaraan mesin PHP = JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php tools/check-engine.php
      - run: npm run test:engine

  laravel:
    name: Laravel (migrate, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Siapkan .env dan database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
      - run: php artisan test
      - run: npm ci
      - run: npm run build
